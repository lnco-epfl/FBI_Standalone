    leftLabel: 0 - Never
    rightLabel: Continuously - 5

  - stepType: displayLikertScale
    startTime: 1293
    blocking: true
    question: How wide or boundless did your awareness feel?
    leftLabel: 0 - Not wide
    rightLabel: Very wide - 5

  - stepType: displayQuestion
    startTime: 1294
    blocking: true
    question: Was there still a sense of a 'self' present?
    options:
    - 0 - Not at all
    - 2.5 - Somewhat
    - 5 - Completely

  - stepType: break
    startTime: 1295
    text: This concludes the meditative phase. The following is the final measurement.
    duration: 60

  # =========================================================================
  # B. POST-SEQUENCE FBI MEASUREMENT
  # =========================================================================

  - stepType: loadScene
    startTime: 1355
    scenePath: BlackScene

  - stepType: displayText
    startTime: 1356
    text: Welcome to Full Body Illusion experiment
    duration: 4.0

  - stepType: wait
    startTime: 1360
    duration: 1.0

  # --- Front Sync / SYNC stroking (delay 0 s) ---

  - stepType: sendLSLEvent
    startTime: 1361
    eventName: config_loaded_Mirror_Flip

  - stepType: loadConfig
    startTime: 1361
    configName: Mirror - Flip

  - stepType: displayImage
    startTime: 1362
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 1365
    eventName: fbi_front_sync_avatar_on

  - stepType: displayCameras
    startTime: 1365
    duration: 90.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: Mirror - Flip

  - stepType: sendLSLEvent
    startTime: 1455
    eventName: fbi_front_sync_avatar_off

  - stepType: wait
    startTime: 1455
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1457
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  - stepType: displayLikertScale
    startTime: 1458
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  - stepType: displayLikertScale
    startTime: 1459
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  # --- Front Async / ASYNC stroking (delay 0.5 s) ---

  - stepType: wait
    startTime: 1460
    duration: 2.0

  - stepType: displayImage
    startTime: 1462
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 1465
    eventName: fbi_front_async_cue_audio_start

  - stepType: playSound
    startTime: 1465

  - stepType: sendLSLEvent
    startTime: 1465
    eventName: fbi_front_async_avatar_on

  - stepType: displayCameras
    startTime: 1465
    duration: 90.0
    cameraDatas:
    - id: '1'
      delay: 0.5
      configName: Mirror - Flip

  - stepType: sendLSLEvent
    startTime: 1555
    eventName: fbi_front_async_avatar_off

  - stepType: wait
    startTime: 1555
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1557
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  - stepType: displayLikertScale
    startTime: 1558
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  - stepType: displayLikertScale
    startTime: 1559
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  # --- Back Sync / SYNC stroking (delay 0 s) ---

  - stepType: wait
    startTime: 1560
    duration: 2.0

  - stepType: sendLSLEvent
    startTime: 1562
    eventName: config_loaded_3PP

  - stepType: loadConfig
    startTime: 1562
    configName: 3PP

  - stepType: displayImage
    startTime: 1563
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 1566
    eventName: fbi_back_sync_cue_audio_start

  - stepType: playSound
    startTime: 1566

  - stepType: sendLSLEvent
    startTime: 1566
    eventName: fbi_back_sync_avatar_on

  - stepType: displayCameras
    startTime: 1566
    duration: 90.0
    cameraDatas:
    - id: '2'
      delay: 0.0
      configName: 3PP

  - stepType: sendLSLEvent
    startTime: 1656
    eventName: fbi_back_sync_avatar_off

  - stepType: wait
    startTime: 1656
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1658
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

  - stepType: displayLikertScale
    startTime: 1659
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree

