    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- B4. Back view / ASYNC stroking ---
  - stepType: wait
    startTime: 296.0
    duration: 2.0

  - stepType: displayImage
    startTime: 298.0
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 301.0

  - stepType: displayCameras
    startTime: 301.0
    duration: 90.0
