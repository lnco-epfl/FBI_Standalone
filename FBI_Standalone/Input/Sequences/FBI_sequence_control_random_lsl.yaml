    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 23.904
    eventName: fbi_back_sync_cue_audio_start

  - stepType: playSound
    startTime: 23.904

  - stepType: sendLSLEvent
    startTime: 23.904
    eventName: fbi_back_sync_avatar_on

  - stepType: displayCameras
    startTime: 23.904
    duration: 90
    cameraDatas:
    - id: '2'
      delay: 0.0
      configName: 3PP

  - stepType: sendLSLEvent
    startTime: 113.904
    eventName: fbi_back_sync_avatar_off

  - stepType: wait
    startTime: 113.904
    duration: 1

  - stepType: displayLikertScale
    startTime: 114.904
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
