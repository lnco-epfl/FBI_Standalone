# =========================================================================
# FBI Standalone - CONTROL Sequence (GENERATED - do not edit by hand)
# Random-order FBI (pre + post) with a meditation gap of 1200 s (20 min)
#
# Randomization: seed 42
# Pre  FBI condition order: back-sync, front-async, back-async, front-sync
# Post FBI condition order: back-async, back-sync, front-sync, front-async
#
# Camera mapping (per lab convention):
#   id "1" = 1PP / 3PP FRONT view
#   id "2" = 3PP BACK view
# =========================================================================

steps:


  # =========================================================================
