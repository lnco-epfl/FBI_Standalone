steps:
  - stepType: loadScene
    scenePath: "EmptyRoom"

  - stepType: loadConfig
    configName: interpolation

  - stepType: displayVideo
    videoName: "FBI_demo_video"
    looping: false
    muteAudio: false

  - stepType: displayText
    text: "welcome to FBI"
    duration: 3.0

  - stepType: wait
    duration: 2.0

  - stepType: displayCameras
    duration: 20
    cameraDatas:
#      - id: "1"
#        delay: 0.0
#        configName: interpolation
#        dissolution:
#          duration: 5.0
#          delay: 5.0
      - id: "1"
        delay: 0.0
        configName: 1PP
        interpolation:
          duration: 3.0
          delay: 5.0
          ease: InOutQuad
          startConfigName: interpolation
      - id: "1"
        delay: 0.0
        configName: interpolation
        dissolution:
          duration: 5.0
          delay: 5.0


  - stepType: wait
    duration: 2.0

  - stepType: displayCameras
    duration: 20
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: interpolation
        dissolution:
          duration: 5.0
          delay: 5.0
      - id: "1"
        delay: 0.0
        configName: 1PP
        interpolation:
          duration: 3.0
          delay: 5.0
          ease: InOutQuad
          startConfigName: interpolation


  - stepType: displayCameras
    duration: 20.0
    cameraDatas:
      - id: "1"
        delay: 0.5
        configName: 1PP

  - stepType: loadConfig
    configName: interpolation2

  - stepType: wait
    duration: 2.0

  - stepType: displayCameras
    duration: 20.0
    cameraDatas:
      - id: "2"
        delay: 0.0

  - stepType: wait
    duration: 2.0

  - stepType: displayCameras
    duration: 20.0
    cameraDatas:
      - id: "2"
        delay: 0.5

  - stepType: wait
    duration: 2.0

  - stepType: displayImage
    imagePath: "plus"
    scale: 0.3
    duration: 5.0

  - stepType: playSound
    soundPath: "bell-sfx"

  - stepType: displayQuestion
    question: "question 1"
    options:
      - "option 1"
      - "option 2"
      - "option 3"
      - "option 4"

  - stepType: displayLikertScale
    question: "satisfaction question"
    leftLabel: "not satisfied"
    rightLabel: "very satisfied"

  - stepType: break
    text: "break instructions"
    duration: 90

  - stepType: wait
    duration: 1.0

  - stepType: displayText
    text: "thank you"
    duration: 4.0