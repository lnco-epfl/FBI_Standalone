steps:
  - stepType: LoadScene
    startTime: 0
    scenePath: "EmptyRoom"

  - stepType: LoadConfig
    startTime: 1.0
    configName: 3PP

  - stepType: DisplayVideo
    startTime: 2.0
    videoName: "FBI_demo_video"
    looping: false
    muteAudio: false

  - stepType: DisplayText
    startTime: 12.0
    text: "welcome to FBI"
    duration: 3.0

  - stepType: wait
    startTime: 15.0
    duration: 2.0

  - stepType: sendLSLEvent
    startTime: 15.0
    eventName: "test"

  - stepType: sendLSLEvent
    startTime: 15.0
    eventName: "test2"

  - stepType: playSound
    startTime: 12.0
    soundPath: "NoM_Phase1"

  - stepType: displayCameras
    startTime: 15.0
    duration: 5
    cameraDatas:
#      - id: "1"
#        delay: 0.0
#        configName: 3PP
#        dissolution:
#          duration: 5.0
#          delay: 5.0
      - id: "1"
        delay: 0.0
        configName: Mirror
        fade:
          duration: 5.0
          delay: 1.0

  - stepType: displayCameras
    startTime: 10
    duration: 5.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 3PP
        fade:
          duration: 3.0
          delay: 1.0

  - stepType: wait
    startTime: 37.0
    duration: 2.0

  - stepType: displayCameras
    startTime: 38
    duration: 20
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP
      fade:
        duration: 1.5
        delay: 10
    - id: '2'
      delay: 0.0
      configName: 3PP - Back
    rigInterpolation:
      startPosition:
        x: 0.0
        y: 0.0
        z: 0.0
      endPosition:
        x: 0.0
        y: 0.0
        z: -1.5
      startYaw: 0.0
      endYaw: 0.0
      delay: 0.0
      duration: 5.0
      ease: InOutSine

  - stepType: displayCameras
    startTime: 60
    duration: 5
    cameraDatas:
    - id: '2'
      delay: 0.0
      configName: 3PP - Back

  - stepType: displayCameras
    startTime: 70
    duration: 20
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP - Flip
    - id: '2'
      delay: 0.0
      configName: 3PP - Back
      fade:
        duration: 1.5
        delay: 5
    rigInterpolation:
      startPosition:
        x: 0.0
        y: 0.0
        z: -1.5
      endPosition:
        x: 0.0
        y: 0.0
        z: 0.0
      startYaw: 0.0
      endYaw: 0.0
      delay: 0.0
      duration: 5.0
      ease: InOutSine
      
  - stepType: wait
    startTime: 102.0
    duration: 2.0

  - stepType: displayCameras
    startTime: 104.0
    duration: 20.0
    cameraDatas:
      - id: "2"
        delay: 0.5

  - stepType: wait
    startTime: 124.0
    duration: 2.0

  - stepType: displayImage
    startTime: 126.0
    imagePath: "plus"
    scale: 0.3
    duration: 5.0

  - stepType: playSound
    startTime: 131.0
    soundPath: "bell-sfx"

  - stepType: displayQuestion
    blocking: true 
    startTime: 131.5
    question: "question 1"
    options:
      - "option 1"
      - "option 2"
      - "option 3"
      - "option 4"

  - stepType: displayLikertScale
    blocking: true 
    startTime: 135.5
    question: "satisfaction question"
    leftLabel: "not satisfied"
    rightLabel: "very satisfied"
    min: 1
    max: 5
    randomCursorPosition: true

  - stepType: break
    startTime: 139.5
    text: "break instructions"
    duration: 90

  - stepType: wait
    startTime: 229.5
    duration: 1.0

  - stepType: displayText
    startTime: 230.5
    text: "thank you"
    duration: 4.0