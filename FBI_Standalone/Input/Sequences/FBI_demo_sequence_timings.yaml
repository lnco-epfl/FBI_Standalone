    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 946
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayQuestion
    blocking: true
    startTime: 946
    question: "Are you the visual self or the moving self?"
    options:
      - "The visual self"
      - "The moving self"
      - "Both / neither"

  - stepType: displayLikertScale
    blocking: true
    startTime: 946
    question: "How clear is your sense of where your body begins?"
    leftLabel: "0 - Not clear"
    rightLabel: "5 - Very clear"

  - stepType: wait
    startTime: 946
    duration: 2.0


  # =========================================================================
  # 4. 3PP FRONT - Facing avatar
  # Both avatars come from camera "1" (the front camera), shown
  # SIMULTANEOUSLY as two separate point cloud entries in the same
  # cameraDatas list: one in the 1PP-inverted config (own moving body)
  # and one in a facing config (the "other self" facing the
  # participant). Camera "2" (back) is NOT used in this phase.
  # Audio: self-location ambiguity script + arm-movement instructions.
  # =========================================================================

  - stepType: displayCameras
    startTime: 948
    duration: 178.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP_Inverted
      - id: "1"
        delay: 0.0
        configName: Other_Self

  - stepType: playSound
    startTime: 949
    #soundPath: "phase4_3pp_mirror_script"

  - stepType: loadConfig
