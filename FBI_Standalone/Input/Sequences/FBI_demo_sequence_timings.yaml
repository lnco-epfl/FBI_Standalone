# =========================================================================
# FBI Standalone - Demo Sequence
# Full-Body Illusion (Baseline + Post) x Meditative Body-Perspective Manipulation
#
# Structure:
#   A. Baseline FBI Measurement   - 2x2 (view: front/back) x (stroking: sync/async)
#   1. 1PP Embodiment             - camera 1, 1PP config
#   2. 3PP Back (OBX)             - camera 2, 3PP back config
#   3. 1PP Inverted               - camera 1, inverted config
#   4. 3PP Mirror (facing avatar) - camera 1 used twice: 1PP-inverted self
#                                    + facing avatar, simultaneous
#   5. Ego dissolution            - no avatar
#   B. Post-sequence FBI Measurement - same 2x2 as Baseline
#
# Camera mapping (per lab convention):
#   id "1" = 1PP / 3PP FRONT view
#   id "2" = 3PP BACK view
#
# Condition order for the FBI 2x2 blocks (front/back x sync/async) is
# RANDOMIZED / COUNTERBALANCED across participants. The order below
# (front-sync, front-async, back-sync, back-async) is a PLACEHOLDER -
# replace per your counterbalancing table / randomization script before
# each session, or swap blocks manually.
# =========================================================================

steps:

  # -----------------------------------------------------------------------
  # SETUP
  # -----------------------------------------------------------------------
  - stepType: loadScene
    startTime: 0
    scenePath: "BlackScene"

  - stepType: loadConfig
    startTime: 1
    configName: 1PP

  - stepType: DisplayVideo
    startTime: 2
    videoName: "FBI_demo_video"
    looping: false
    muteAudio: false

  - stepType: wait
    startTime: 32
    duration: 2.0


  # =========================================================================
  # A. BASELINE FBI MEASUREMENT - phase timer reset to 0
  # 2x2 (view x stroking), ~8 min (4 x 90s + questionnaire)
  # ORDER BELOW IS A PLACEHOLDER (front-sync, front-async, back-sync, back-async)
  # Randomize/counterbalance per participant.
  # =========================================================================

  - stepType: wait
    startTime: 34
    duration: 1.0

  - stepType: displayText
    startTime: 35
    text: "Welcome to Full Body Illusion experiment"
    duration: 3.0

  # --- A1. Front view / SYNC stroking ---
  - stepType: loadConfig
    startTime: 38
    configName: 1PP

  - stepType: displayImage
    startTime: 39
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: displayCameras
    startTime: 42
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.0 #sync stroking
        configName: 1PP

  - stepType: wait
    startTime: 132
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 134
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 134.25
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 134.5
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A2. Front view / ASYNC stroking ---
  - stepType: wait
    startTime: 134.75
    duration: 2.0

  - stepType: displayImage
    startTime: 136
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 139

  - stepType: displayCameras
    startTime: 139
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.5 #async stroking
        configName: 1PP

  - stepType: wait
    startTime: 229
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 231
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 231
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 231
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A3. Back view / SYNC stroking ---
  - stepType: wait
    startTime: 231
    duration: 2.0

  - stepType: loadConfig
    startTime: 233
    configName: 3PP

  - stepType: displayImage
    startTime: 234
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 237


  - stepType: displayCameras
    startTime: 237
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: wait
    startTime: 327
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 329
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 329
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 329
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A4. Back view / ASYNC stroking ---
  - stepType: wait
    startTime: 329
    duration: 2.0

  - stepType: displayImage
    startTime: 331
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 334

  - stepType: displayCameras
    startTime: 334
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.5
        configName: 3PP

  - stepType: wait
    startTime: 424
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 426
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 426
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 426
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: break
    startTime: 426
    text: "Baseline measurement complete. Please take a short break."
    duration: 30


  # =========================================================================
  # 1. 1PP EMBODIMENT - camera 1, 1PP config - phase timer reset to 0
  # Audio: grounding/breath-focus script. Probes at end of phase.
  # =========================================================================

  - stepType: loadScene
    startTime: 456
    scenePath: "EmptyRoom"

  - stepType: loadConfig
    startTime: 457
    configName: 1PP

  - stepType: playSound
    startTime: 458
  #  soundPath: "phase1_1pp_embodiment_script"

  - stepType: displayCameras
    startTime: 458
    duration: 178.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP

  - stepType: wait
    startTime: 636
    duration: 2.0

  # Probing (visual analog scales, at end of phase)
  - stepType: displayLikertScale
    blocking: true
    startTime: 638
    question: "How much do you feel that the body that you see is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 638
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 638
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 638
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayLikertScale
    blocking: true
    startTime: 638
    question: "How stable is your attention right now?"
    leftLabel: "0 - Not stable"
    rightLabel: "5 - Very stable"

  - stepType: displayLikertScale
    blocking: true
    startTime: 638
    question: "How clearly do you feel your body?"
    leftLabel: "0 - Not clearly"
    rightLabel: "5 - Very clearly"

  - stepType: wait
    startTime: 638
    duration: 2.0


