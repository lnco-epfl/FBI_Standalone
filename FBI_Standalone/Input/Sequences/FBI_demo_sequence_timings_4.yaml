  # --- B3. Back view / SYNC stroking ---
  - stepType: wait
    startTime: 1642
    duration: 2.0

  - stepType: loadConfig
    startTime: 1645
    configName: 3PP

  - stepType: displayImage
    startTime: 1646
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1650

  - stepType: displayCameras
    startTime: 1650
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.0
