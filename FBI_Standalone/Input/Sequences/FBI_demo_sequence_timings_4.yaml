  - stepType: displayImage
    startTime: 1541
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1545

  - stepType: displayCameras
    startTime: 1545
    duration: 90.0
    cameraDatas:
      - id: "1"
