  - stepType: playSound
    startTime: 384

  - stepType: sendLSLEvent
    startTime: 384
    eventName: fbi_back_async_avatar_on

  - stepType: displayCameras
    startTime: 384
    duration: 90.0
    cameraDatas:
    - id: '2'
      delay: 0.5
