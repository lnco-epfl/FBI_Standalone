    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 276
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 277
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  # --- Back Sync / SYNC stroking (delay 0 s) ---

  - stepType: wait
    startTime: 278
    duration: 2.0

  - stepType: sendLSLEvent
    startTime: 280
    eventName: config_loaded_3PP

  - stepType: loadConfig
    startTime: 280
    configName: 3PP

  - stepType: displayImage
    startTime: 281
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 284
    eventName: fbi_back_sync_cue_audio_start

  - stepType: playSound
    startTime: 284

  - stepType: sendLSLEvent
    startTime: 284
    eventName: fbi_back_sync_avatar_on

  - stepType: displayCameras
    startTime: 284
    duration: 90.0
    cameraDatas:
    - id: '2'
      delay: 0.0
      configName: 3PP

  - stepType: sendLSLEvent
    startTime: 374
    eventName: fbi_back_sync_avatar_off

  - stepType: wait
    startTime: 374
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 376
    blocking: true
    question: I felt that the body I saw was my body.
