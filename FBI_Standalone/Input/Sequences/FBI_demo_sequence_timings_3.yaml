  - stepType: wait
    startTime: 924
    duration: 2.0

  # Probing (visual analog scales, at end of phase)
  - stepType: displayLikertScale
    blocking: true
    startTime: 926
    question: "How much do you feel that the body that you see is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 927
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 928
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 929
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayQuestion
    blocking: true
    startTime: 930
    question: "Are you the visual self or the moving self?"
    options:
      - "The visual self"
      - "The moving self"
      - "Both / neither"

  - stepType: displayLikertScale
    blocking: true
    startTime: 931
    question: "How clear is your sense of where your body begins?"
    leftLabel: "0 - Not clear"
    rightLabel: "5 - Very clear"

  - stepType: wait
    startTime: 926
    duration: 2.0


  # =========================================================================
  # 4. 3PP FRONT - Facing avatar
  # Both avatars come from camera "1" (the front camera), shown
  # SIMULTANEOUSLY as two separate point cloud entries in the same
  # cameraDatas list: one in the 1PP-inverted config (own moving body)
  # and one in a facing config (the "other self" facing the
  # participant). Camera "2" (back) is NOT used in this phase.
  # Audio: self-location ambiguity script + arm-movement instructions.
  # =========================================================================

  # Avatar 1: own moving body (1PP - Flip), camera 1.
  # Starts at the phase start and runs the full 3 min (180 s).
  - stepType: displayCameras
    startTime: 928
    duration: 180.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip

  # Avatar 2: facing "other self" (Mirror - Flip), camera 1, shown
  # simultaneously. Starts 10 s after avatar 1 and runs 2 min 50 s
  # (170 s) so both avatars end together at 1108.
  - stepType: displayCameras
    startTime: 938
    duration: 170.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: Mirror - Flip
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 1PP - Flip   # the facing "other self" emerges from your own body position

  - stepType: playSound
    startTime: 929
    #soundPath: "phase4_3pp_mirror_script"

  - stepType: wait
    startTime: 1108
    duration: 2.0

  # Probing (visual analog scales, at end of phase)
  - stepType: displayLikertScale
    blocking: true
    startTime: 1110
    question: "How much do you feel that the body that you see is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1111
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1112
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1113
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayQuestion
    blocking: true
    startTime: 1114
    question: "Which body felt most like you?"
    options:
      - "The moving body"
      - "The mirror body"
      - "Neither"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1115
    question: "How fixed was your sense of self-location?"
    leftLabel: "0 - Not fixed"
    rightLabel: "5 - Very fixed"

  - stepType: wait
    startTime: 1110
    duration: 2.0


  # =========================================================================
  # 5. EGO DISSOLUTION - No avatar - phase timer reset to 0
  # NOTE: No dedicated step type yet exists for the animated "scaling down to
  # a point then disappearing" avatar transition described in the design doc
  # (the "stars" transition). Implemented here as a scene change with a
  # short wait as a placeholder; replace with the dedicated transition once
  # available in the Unity build. Audio: open-awareness script.
  # =========================================================================

  - stepType: loadScene
    startTime: 1112
    scenePath: "EmptyRoom"

  # The participant's body (1PP - Flip) is shown briefly, then progressively
  # dissolves to nothing - the "scaling down to a point then disappearing"
  # transition - leaving no avatar for the open-awareness rest that follows.
  - stepType: displayCameras
    startTime: 1113
    duration: 8.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip
        dissolution:
          duration: 6.0
          delay: 1.0

  - stepType: playSound
    startTime: 1121
  #  soundPath: "phase5_ego_dissolution_script"

  - stepType: wait
    startTime: 1121
    duration: 169.0
    # remainder of the ~3 min phase, resting in open awareness

  - stepType: wait
    startTime: 1290
    duration: 2.0

  # Probing (visual analog scales, at end of phase)
  - stepType: displayLikertScale
    blocking: true
    startTime: 1292
    question: "How much do you feel that the body that you see is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1293
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1294
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1295
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1296
    question: "How wide or boundless did your awareness feel?"
    leftLabel: "0 - Not wide"
    rightLabel: "5 - Very wide"

  - stepType: displayQuestion
    blocking: true
    startTime: 1297
    question: "Was there still a sense of a 'self' present?"
    options:
      - "0 - Not at all"
      - "2.5 - Somewhat"
      - "5 - Completely"

  - stepType: break
    startTime: 1292
    text: "This concludes the meditative phase. The following is the final measurement."
    duration: 60


  # =========================================================================
  # B. POST-SEQUENCE FBI MEASUREMENT
  # 2x2 (view x stroking), ~8 min
  # ORDER BELOW IS A PLACEHOLDER (front-sync, front-async, back-sync, back-async)
  # Randomize/counterbalance per participant (independently from Baseline order
  # if desired).
  # =========================================================================

  - stepType: loadScene
    startTime: 1352
    scenePath: "BlackScene"

  - stepType: displayText
    startTime: 1352
    text: "Welcome to Full Body Illusion experiment"
    duration: 4.0

  - stepType: wait
    startTime: 1356
    duration: 1.0

  # --- B1. Front view / SYNC stroking ---
  - stepType: loadConfig
    startTime: 1357
    configName: Mirror - Flip

  - stepType: displayImage
    startTime: 1358
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: displayCameras
    startTime: 1361
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.0 # sync stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 1451
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 1453
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1454
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1455
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- B2. Front view / ASYNC stroking ---
  - stepType: wait
    startTime: 1453
    duration: 2.0

  - stepType: displayImage
    startTime: 1455
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1458

  - stepType: displayCameras
    startTime: 1458
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.5 # async stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 1548
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 1550
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1551
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1552
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- B3. Back view / SYNC stroking ---
  - stepType: wait
    startTime: 1550
    duration: 2.0

  - stepType: loadConfig
    startTime: 1552
    configName: 3PP

  - stepType: displayImage
    startTime: 1553
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1556

  - stepType: displayCameras
    startTime: 1556
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: wait
    startTime: 1646
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 1648
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1649
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1650
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- B4. Back view / ASYNC stroking ---
  - stepType: wait
    startTime: 1648
    duration: 2.0

  - stepType: displayImage
    startTime: 1650
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1653

  - stepType: displayCameras
    startTime: 1653
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.5
        configName: 3PP

  - stepType: wait
    startTime: 1743
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 1745
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1746
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 1747
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: wait
    startTime: 1745
