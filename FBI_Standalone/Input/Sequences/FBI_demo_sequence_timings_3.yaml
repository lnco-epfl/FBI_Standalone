# =========================================================================
# FBI Standalone - Demo Sequence
# Full-Body Illusion (Baseline + Post) x Meditative Body-Perspective Manipulation
#
# Structure:
#   A. Baseline FBI Measurement   - 2x2 (view: front/back) x (stroking: sync/async)
#   1. 1PP Embodiment             - camera 1, 1PP config
#   2. 3PP Back (OBX)             - camera 2, 3PP back config
#   3. 1PP Inverted               - camera 1, inverted config
#   4. 3PP Mirror (facing avatar) - camera 1 used twice: 1PP-inverted self
#                                    + facing avatar, simultaneous
#   5. Ego dissolution            - no avatar
#   B. Post-sequence FBI Measurement - same 2x2 as Baseline
#
# Camera mapping (per lab convention):
#   id "1" = 1PP / 3PP FRONT view
#   id "2" = 3PP BACK view
#
# Condition order for the FBI 2x2 blocks (front/back x sync/async) is
# RANDOMIZED / COUNTERBALANCED across participants. The order below
# (front-sync, front-async, back-sync, back-async) is a PLACEHOLDER -
# replace per your counterbalancing table / randomization script before
# each session, or swap blocks manually.
# =========================================================================

steps:

  # -----------------------------------------------------------------------
  # SETUP
  # -----------------------------------------------------------------------
  - stepType: loadScene
    startTime: 0
    scenePath: "BlackScene"

  - stepType: loadConfig
    startTime: 1
    configName: 1PP

  - stepType: DisplayVideo
    startTime: 2
    videoName: "FBI_demo_video"
    looping: false
    muteAudio: false

  - stepType: wait
    startTime: 12 # change following durations
    duration: 2.0


  # =========================================================================
  # A. BASELINE FBI MEASUREMENT - phase timer reset to 0
  # 2x2 (view x stroking), ~8 min (4 x 90s + questionnaire)
  # ORDER BELOW IS A PLACEHOLDER (front-sync, front-async, back-sync, back-async)
  # Randomize/counterbalance per participant.
  # =========================================================================

  - stepType: wait
    startTime: 14
    duration: 1.0

  - stepType: displayText
    startTime: 15
    text: "Welcome to Full Body Illusion experiment"
    duration: 3.0

  # --- A1. Front view / SYNC stroking ---
  - stepType: loadConfig
    startTime: 18
    configName: Mirror - Flip

  - stepType: displayImage
    startTime: 19
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: displayCameras
    startTime: 22
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.0 #sync stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 112
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 114
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 115
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 116
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A2. Front view / ASYNC stroking ---
  - stepType: wait
    startTime: 114
    duration: 2.0

  - stepType: displayImage
    startTime: 116
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 119

  - stepType: displayCameras
    startTime: 119
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.5 #async stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 209
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 211
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 212
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 213
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A3. Back view / SYNC stroking ---
  - stepType: wait
    startTime: 211
    duration: 2.0

  - stepType: loadConfig
    startTime: 213
    configName: 3PP

  - stepType: displayImage
    startTime: 214
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 217


  - stepType: displayCameras
    startTime: 217
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: wait
    startTime: 307
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 309
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 310
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 311
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A4. Back view / ASYNC stroking ---
  - stepType: wait
    startTime: 309
    duration: 2.0

  - stepType: displayImage
    startTime: 311
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 314

  - stepType: displayCameras
    startTime: 314
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.5
        configName: 3PP

  - stepType: wait
    startTime: 404
    duration: 2.0

  - stepType: displayLikertScale
    blocking: true
    startTime: 406
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 407
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    blocking: true
    startTime: 408
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: break
    startTime: 406
    text: "Baseline measurement complete. Please take a short break."
    duration: 30


  # =========================================================================
  # 1. 1PP EMBODIMENT - camera 1, 1PP config - phase timer reset to 0
  # Audio: grounding/breath-focus script. Probes at end of phase.
  # =========================================================================

  - stepType: loadScene
    startTime: 436
    scenePath: "EmptyRoom"

  - stepType: loadConfig
    startTime: 437
    configName: 1PP

  - stepType: playSound
    startTime: 438
  #  soundPath: "phase1_1pp_embodiment_script"

  - stepType: displayCameras
    startTime: 438
    duration: 178.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 3PP   # morph from the previous (3PP) view into 1PP

  - stepType: wait
    startTime: 616
    duration: 2.0

  # Probing (visual analog scales, at end of phase)
  - stepType: displayLikertScale
    blocking: true
    startTime: 618
    question: "How much do you feel that the body that you see is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 619
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 620
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 621
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayLikertScale
    blocking: true
    startTime: 622
    question: "How stable is your attention right now?"
    leftLabel: "0 - Not stable"
    rightLabel: "5 - Very stable"

  - stepType: displayLikertScale
    blocking: true
    startTime: 623
    question: "How clearly do you feel your body?"
    leftLabel: "0 - Not clearly"
    rightLabel: "5 - Very clearly"

  - stepType: wait
    startTime: 618
    duration: 2.0


  # =========================================================================
  # 2. 3PP BACK (OBX) - camera 2, 3PP back config - phase timer reset to 0
  # Audio: perspective-shift script + arm-movement instructions.
  # =========================================================================

  - stepType: loadConfig
    startTime: 620
    configName: 3PP

  - stepType: playSound
    startTime: 621
  #  soundPath: "phase2_3pp_back_script"

  - stepType: displayCameras
    startTime: 621
    duration: 119.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 1PP   # morph from 1PP into the 3PP back view

  - stepType: wait
    startTime: 740
    duration: 2.0

  # Probing (visual analog scales, at end of phase)
  - stepType: displayLikertScale
    blocking: true
    startTime: 742
    question: "How much do you feel that the body that you see is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 743
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 744
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: displayLikertScale
    blocking: true
    startTime: 745
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "5 - Continuously"

  - stepType: displayQuestion
    blocking: true
    startTime: 746
    question: "Where do you feel yourself to be located?"
    options:
      - "Inside the body I see"
      - "Outside the body I see"
      - "Somewhere else / unclear"

  - stepType: displayLikertScale
    blocking: true
    startTime: 747
    question: "Does this body feel like yours?"
    leftLabel: "0 - Not at all"
    rightLabel: "5 - Completely"

  - stepType: wait
    startTime: 742
    duration: 2.0


  # =========================================================================
  # 3. 1PP INVERTED - camera 1, inverted config - phase timer reset to 0
  # Audio: sensorimotor conflict script + arm-movement instructions.
  # =========================================================================

  - stepType: loadConfig
    startTime: 744
    configName: 1PP - Flip

  - stepType: playSound
    startTime: 745
  #  soundPath: "phase3_1pp_inverted_script"

  - stepType: displayCameras
    startTime: 745
    duration: 178.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
