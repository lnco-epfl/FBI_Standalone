# =========================================================================
# FBI Standalone - Demo Sequence
# Full-Body Illusion (Baseline + Post) x Meditative Body-Perspective Manipulation
#
# Structure:
#   A. Baseline FBI Measurement   - 2x2 (view: front/back) x (stroking: sync/async)
#   1. 1PP Embodiment             - camera 1, 1PP config
#   2. 3PP Back (OBX)             - camera 2, 3PP back config
#   3. 1PP - Flip                 - camera 1, inverted config
#   4. 3PP Mirror - Flip (facing) - camera 1 no inversion
#   5. Ego dissolution            - no avatar
#   B. Post-sequence FBI Measurement - same 2x2 as Baseline
#
# Camera mapping (per lab convention):
#   id "1" = 1PP / 3PP FRONT view
#   id "2" = 3PP BACK view
#
# Condition order for the FBI 2x2 blocks is RANDOMIZED / COUNTERBALANCED
# across participants. The order below (front-sync, front-async, back-sync,
# back-async) is a PLACEHOLDER - replace per your counterbalancing table.
#
# =========================================================================

steps:

  # -----------------------------------------------------------------------
  # SETUP
  # -----------------------------------------------------------------------
  - stepType: loadScene
    startTime: 0
    scenePath: "BlackScene"

  - stepType: loadConfig
    startTime: 1
    configName: 1PP

  - stepType: DisplayVideo
    startTime: 2
    videoName: "FBI_demo_video"
    looping: false
    muteAudio: false

  - stepType: wait
    startTime: 12
    duration: 2.0

  # =========================================================================
  # A. BASELINE FBI MEASUREMENT
  # =========================================================================
  - stepType: wait
    startTime: 15
    duration: 1.0

  - stepType: displayText
    startTime: 17
    text: "Welcome to Full Body Illusion experiment"
    duration: 3.0

  # --- A1. Front view / SYNC stroking ---
  - stepType: loadConfig
    startTime: 21
    configName: Mirror - Flip

  - stepType: displayImage
    startTime: 22
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: displayCameras
    startTime: 26
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.0 #sync stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 117
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 120
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 121
    blocking: true
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 122
    blocking: true
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A2. Front view / ASYNC stroking ---
  - stepType: wait
    startTime: 123
    duration: 2.0

  - stepType: displayImage
    startTime: 126
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 130

  - stepType: displayCameras
    startTime: 130
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.5 #async stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 221
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 224
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 225
    blocking: true
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 226
    blocking: true
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A3. Back view / SYNC stroking ---
  - stepType: wait
    startTime: 227
    duration: 2.0

  - stepType: loadConfig
    startTime: 230
    configName: 3PP

  - stepType: displayImage
    startTime: 231
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 235

  - stepType: displayCameras
    startTime: 235
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: wait
    startTime: 326
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 329
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 330
    blocking: true
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 331
    blocking: true
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- A4. Back view / ASYNC stroking ---
  - stepType: wait
    startTime: 332
    duration: 2.0

  - stepType: displayImage
    startTime: 335
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 339

  - stepType: displayCameras
    startTime: 339
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.5
        configName: 3PP

  - stepType: wait
    startTime: 430
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 433
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 434
    blocking: true
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 435
    blocking: true
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: break
    startTime: 436
    text: "Baseline measurement complete. Please take a short break."
    duration: 30

  # =========================================================================
  # 1. 1PP EMBODIMENT - camera 1, 1PP config
  # =========================================================================
  - stepType: loadScene
    startTime: 467
    scenePath: "EmptyRoom"

  - stepType: playSound
    startTime: 469

  - stepType: displayCameras  # settle: hold previous-phase config before interpolation
    startTime: 469
    duration: 5.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: displayCameras
    startTime: 474
    duration: 178.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 3PP   # morph from the previous (3PP) view into 1PP

  - stepType: wait
    startTime: 653
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 656
    blocking: true
    question: "How much do you feel that the body that you saw is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 657
    blocking: true
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 658
    blocking: true
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 659
    blocking: true
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "Continuously - 5"

  - stepType: displayLikertScale
    startTime: 660
    blocking: true
    question: "How stable is your attention right now?"
    leftLabel: "0 - Not stable"
    rightLabel: "Very stable - 5"

  - stepType: displayLikertScale
    startTime: 661
    blocking: true
    question: "How clearly do you feel your body?"
    leftLabel: "0 - Not clearly"
    rightLabel: "Very clearly - 5"
  - stepType: wait
    startTime: 662
    duration: 2.0

  # =========================================================================
  # 2. 3PP BACK (OBX) - camera 2, 3PP back config
  # =========================================================================

  - stepType: playSound
    startTime: 666

  - stepType: displayCameras  # settle: hold previous-phase config before interpolation
    startTime: 666
    duration: 5.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP
        
  - stepType: displayCameras
    startTime: 671
    duration: 119.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 1PP   # morph from 1PP into the 3PP back view

  - stepType: wait
    startTime: 791
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 794
    blocking: true
    question: "How much do you feel that the body that you saw is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 795
    blocking: true
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 796
    blocking: true
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 797
    blocking: true
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "Continuously - 5"

  - stepType: displayQuestion
    startTime: 798
    blocking: true
    question: "Where do you feel yourself to be located?"
    options:
      - "Inside the body I see"
      - "Outside the body I see"
      - "Somewhere else / unclear"

  - stepType: displayLikertScale
    startTime: 799
    blocking: true
    question: "Does this body feel like yours?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: wait
    startTime: 800
    duration: 2.0

  # =========================================================================
  # 3. 1PP INVERTED - camera 1, inverted config
  # =========================================================================

  - stepType: playSound
    startTime: 804

  - stepType: displayCameras  # settle: hold previous-phase config before interpolation
    startTime: 804
    duration: 5.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: displayCameras
    startTime: 809
    duration: 178.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 3PP   # morph from the 3PP back view into 1PP - Flip

  - stepType: wait
    startTime: 988
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 991
    blocking: true
    question: "How much do you feel that the body that you saw is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 992
    blocking: true
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 993
    blocking: true
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 994
    blocking: true
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "Continuously - 5"

  - stepType: displayQuestion
    startTime: 995
    blocking: true
    question: "Are you the visual self or the moving self?"
    options:
      - "The visual self"
      - "The moving self"
      - "Both / neither"

  - stepType: displayLikertScale
    startTime: 996
    blocking: true
    question: "How clear is your sense of where your body begins?"
    leftLabel: "0 - Not clear"
    rightLabel: "Very clear - 5"

  - stepType: wait
    startTime: 997
    duration: 2.0

  # =========================================================================
  # 4. 3PP FRONT - Facing avatar  (TWO point clouds shown SIMULTANEOUSLY)
  # =========================================================================
  # Avatar 1: own moving body (1PP - Flip). Runs the full 180 s.
  - stepType: displayCameras  # settle: hold previous-phase config before interpolation
    startTime: 1000
    duration: 5.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip

  - stepType: displayCameras
    startTime: 1005
    duration: 180.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip

  - stepType: playSound
    startTime: 1006

  # Avatar 2: facing 'other self' (Mirror - Flip), starts +10 s, ends together at avatar1's end.
  - stepType: displayCameras
    startTime: 1015
    duration: 170.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: Mirror - Flip
        interpolation:
          duration: 5.0
          delay: 0.0
          ease: InOutSine
          startConfigName: 1PP - Flip   # facing 'other self' emerges from your own body position

  - stepType: wait
    startTime: 1186
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1189
    blocking: true
    question: "How much do you feel that the body that you saw is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 1190
    blocking: true
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 1191
    blocking: true
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 1192
    blocking: true
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "Continuously - 5"

  - stepType: displayQuestion
    startTime: 1193
    blocking: true
    question: "Which body felt most like you?"
    options:
      - "The moving body"
      - "The mirror body"
      - "Neither"

  - stepType: displayLikertScale
    startTime: 1194
    blocking: true
    question: "How fixed was your sense of self-location?"
    leftLabel: "0 - Not fixed"
    rightLabel: "Very fixed - 5"

  - stepType: wait
    startTime: 1195
    duration: 2.0

  # =========================================================================
  # 5. EGO DISSOLUTION - No avatar
  # =========================================================================
  - stepType: loadScene
    startTime: 1198
    scenePath: "EmptyRoom"

  - stepType: displayCameras
    startTime: 1199
    duration: 8.0
    cameraDatas:
      - id: "1"
        delay: 0.0
        configName: 1PP - Flip
        dissolution:
          duration: 6.0
          delay: 1.0

  - stepType: playSound
    startTime: 1208

  - stepType: wait
    startTime: 1208
    duration: 169.0  # rest in open awareness

  - stepType: wait
    startTime: 1378
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1381
    blocking: true
    question: "How much do you feel that the body that you saw is your body?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 1382
    blocking: true
    question: "How much do you experience the sensations of your body right now?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 1383
    blocking: true
    question: "How much do you feel your center of awareness to be located where you feel your body to be?"
    leftLabel: "0 - Not at all"
    rightLabel: "Completely - 5"

  - stepType: displayLikertScale
    startTime: 1384
    blocking: true
    question: "How many times have you been experiencing the nature of mind during this last phase of the experiment?"
    leftLabel: "0 - Never"
    rightLabel: "Continuously - 5"

  - stepType: displayLikertScale
    startTime: 1385
    blocking: true
    question: "How wide or boundless did your awareness feel?"
    leftLabel: "0 - Not wide"
    rightLabel: "Very wide - 5"

  - stepType: displayQuestion
    startTime: 1386
    blocking: true
    question: "Was there still a sense of a 'self' present?"
    options:
      - "0 - Not at all"
      - "2.5 - Somewhat"
      - "5 - Completely"

  - stepType: break
    startTime: 1387
    text: "This concludes the meditative phase. The following is the final measurement."
    duration: 60

  # =========================================================================
  # B. POST-SEQUENCE FBI MEASUREMENT
  # =========================================================================
  - stepType: loadScene
    startTime: 1448
    scenePath: "BlackScene"

  - stepType: displayText
    startTime: 1449
    text: "Welcome to Full Body Illusion experiment"
    duration: 4.0

  - stepType: wait
    startTime: 1454
    duration: 1.0

  # --- B1. Front view / SYNC stroking ---
