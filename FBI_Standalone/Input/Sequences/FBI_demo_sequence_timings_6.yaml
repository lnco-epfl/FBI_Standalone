    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 1557
    blocking: true
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- B2. Front view / ASYNC stroking ---
  - stepType: wait
    startTime: 1558
    duration: 2.0

  - stepType: displayImage
    startTime: 1561
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1565

  - stepType: displayCameras
    startTime: 1565
    duration: 90.0
    cameraDatas:
      - id: "1"
        delay: 0.5 # async stroking
        configName: Mirror - Flip

  - stepType: wait
    startTime: 1656
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1659
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 1660
    blocking: true
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 1661
    blocking: true
    question: "I felt as if I have three bodies."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  # --- B3. Back view / SYNC stroking ---
  - stepType: wait
    startTime: 1662
    duration: 2.0

  - stepType: displayImage
    startTime: 1666
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1670

  - stepType: displayCameras
    startTime: 1670
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.0
        configName: 3PP

  - stepType: wait
    startTime: 1761
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1764
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
