  # --- B4. Back view / ASYNC stroking ---
  - stepType: wait
    startTime: 1767
    duration: 2.0

  - stepType: displayImage
    startTime: 1770
    imagePath: "plus"
    scale: 0.3
    duration: 3.0

  - stepType: playSound
    startTime: 1774

  - stepType: displayCameras
    startTime: 1774
    duration: 90.0
    cameraDatas:
      - id: "2"
        delay: 0.5
        configName: 3PP

  - stepType: wait
    startTime: 1865
    duration: 2.0

  - stepType: displayLikertScale
    startTime: 1868
    blocking: true
    question: "I felt that the body I saw was my body."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 1869
    blocking: true
    question: "I felt that the touch I felt was located where I saw the stroking."
    leftLabel: "Strongly disagree"
    rightLabel: "Strongly agree"

  - stepType: displayLikertScale
    startTime: 1870
