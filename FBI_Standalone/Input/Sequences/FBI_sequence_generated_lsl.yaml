  - stepType: loadScene
    startTime: 1106
    scenePath: EmptyRoom

  - stepType: sendLSLEvent
    startTime: 1107
    eventName: phase5_dissolution_start

  - stepType: displayCameras
    startTime: 1107
    duration: 8.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP - Flip
      dissolution:
        duration: 6.0
        delay: 1.0

  - stepType: sendLSLEvent
    startTime: 1114
    eventName: phase5_avatar_dissolved

  - stepType: sendLSLEvent
    startTime: 1115
    eventName: phase5_audio_NoM_Phase5_start

  - stepType: playSound
    startTime: 1115
    soundPath: NoM_Phase5_v2

  # rest in open awareness

  - stepType: wait
    startTime: 1115
    duration: 173.0

  - stepType: sendLSLEvent
    startTime: 1167.248
    eventName: phase5_audio_NoM_Phase5_end

  - stepType: wait
    startTime: 1288
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 1289
    blocking: true
    question: How much do you feel that the body that you saw is your body?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 1290
    blocking: true
    question: How much do you experience the sensations of your body right now?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 1291
    blocking: true
    question: How much do you feel your center of awareness to be located where you feel your body to be?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 1292
    blocking: true
    question: How many times have you been experiencing the nature of mind during this last phase of the experiment?
    leftLabel: Never
    rightLabel: Continuously
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 1293
    blocking: true
    question: How wide or boundless did your awareness feel?
    leftLabel: Not wide
    rightLabel: Very wide
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayQuestion
    startTime: 1294
    blocking: true
    question: Was there still a sense of a 'self' present?
    options:
    - 0 - Not at all
    - 2.5 - Somewhat
    - 5 - Completely

  - stepType: break
    startTime: 1295
    text: This concludes the meditative phase. The following is the final measurement.
    duration: 60

  # =========================================================================
  # B. POST-SEQUENCE FBI MEASUREMENT
  # =========================================================================

  - stepType: loadScene
    startTime: 1355
    scenePath: BlackScene

  - stepType: displayText
    startTime: 1356
    text: Welcome to Full Body Illusion experiment
    duration: 4.0

  - stepType: displayText
    startTime: 1360
    text: You will now see a body in front of you and feel a touch in the back and on your shoulders. Then we will ask you some questions and all this will be repeated four times.
    duration: 5.0

  - stepType: wait
    startTime: 1365
    duration: 1.0

  # --- Front Sync / SYNC stroking (delay 0 s) ---

  - stepType: sendLSLEvent
    startTime: 1366
    eventName: config_loaded_Mirror_Flip

  - stepType: loadConfig
    startTime: 1366
    configName: Mirror - Flip

  - stepType: displayImage
    startTime: 1367
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 1370
    eventName: fbi_front_sync_avatar_on

  - stepType: displayCameras
    startTime: 1370
    duration: 90.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: Mirror - Flip

  - stepType: sendLSLEvent
    startTime: 1460
    eventName: fbi_front_sync_avatar_off

  - stepType: wait
    startTime: 1460
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 1461
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 1462
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

