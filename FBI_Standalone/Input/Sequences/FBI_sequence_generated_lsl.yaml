    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 904
    blocking: true
    question: How many times have you been experiencing the nature of mind during this last phase of the experiment?
    leftLabel: Never
    rightLabel: Continuously
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayQuestion
    startTime: 905
    blocking: true
    question: Are you the visual self or the moving self?
    options:
    - The visual self
    - The moving self
    - Both / neither

  - stepType: displayLikertScale
    startTime: 906
    blocking: true
    question: How clear is your sense of where your body begins?
    leftLabel: Not clear
    rightLabel: Very clear
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: wait
    startTime: 907
    duration: 1.0

  # =========================================================================
  # 4. 3PP FRONT - Facing avatar  (TWO point clouds shown SIMULTANEOUSLY)
  # =========================================================================

  # Avatar 1: own moving body (1PP - Flip). Runs the full 180 s.

  # settle: hold previous-phase config before interpolation

  - stepType: displayCameras
    startTime: 908
    duration: 4.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP - Flip

  - stepType: sendLSLEvent
    startTime: 913
    eventName: phase4_avatar1_on

  - stepType: displayCameras
    startTime: 913
    duration: 185.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP - Flip

  # Avatar 2: facing 'other self' (Mirror - Flip), starts +10 s, ends together with avatar 1.

  # playSound aligned with avatar 2: 'Now there are two bodies' as the second body emerges. 73 s audio.

  - stepType: sendLSLEvent
    startTime: 923
    eventName: phase4_audio_NoM_Phase4_start

  - stepType: playSound
    startTime: 923
    soundPath: NoM_Phase4_v2

  - stepType: sendLSLEvent
    startTime: 923
    eventName: phase4_avatar2_on

  - stepType: displayCameras
    startTime: 923
    duration: 175.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: Mirror - Flip
      interpolation:
        duration: 5.0
        delay: 0.0
        ease: InOutSine
        startConfigName: 1PP - Flip

  - stepType: sendLSLEvent
    startTime: 1007.528
    eventName: phase4_audio_NoM_Phase4_end

  - stepType: sendLSLEvent
    startTime: 1098
    eventName: phase4_avatars_off

  - stepType: wait
    startTime: 1098
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 1099
    blocking: true
    question: How much do you feel that the body that you saw is your body?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 1100
    blocking: true
    question: How much do you experience the sensations of your body right now?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
