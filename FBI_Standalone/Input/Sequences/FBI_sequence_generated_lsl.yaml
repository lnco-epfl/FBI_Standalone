  - stepType: displayLikertScale
    startTime: 1104
    blocking: true
    question: How fixed was your sense of self-location?
    leftLabel: Not fixed
    rightLabel: Very fixed
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: wait
    startTime: 1105
    duration: 1.0

  # =========================================================================
