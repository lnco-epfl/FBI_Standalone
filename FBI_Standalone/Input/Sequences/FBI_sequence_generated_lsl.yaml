# =========================================================================
# FBI Standalone - Demo Sequence (GENERATED - do not edit by hand)
# Full-Body Illusion (Baseline + Post) x Meditative Body-Perspective Manipulation
#
# Baseline FBI condition order: front-sync, front-async, back-sync, back-async
# Post FBI condition order:     front-sync, front-async, back-sync, back-async
#
# Camera mapping (per lab convention):
#   id "1" = 1PP / 3PP FRONT view
#   id "2" = 3PP BACK view
# =========================================================================

steps:


  # =========================================================================
  # INTRO
  # =========================================================================

  - stepType: loadScene
    startTime: 0
    scenePath: BlackScene

  - stepType: displayVideo
    startTime: 1
    videoName: NoM_Intro
    looping: false
    muteAudio: false

  # =========================================================================
  # A. BASELINE FBI MEASUREMENT
  # =========================================================================

  - stepType: displayText
    startTime: 78
    text: You will now see a body in front of you and feel a touch in the back and on your shoulders. Then we will ask you some questions and all this will be repeated four times.
    duration: 5.0

  - stepType: wait
    startTime: 83
    duration: 1.0

  # --- Front Sync / SYNC stroking (delay 0 s) ---

  - stepType: sendLSLEvent
    startTime: 84
    eventName: config_loaded_Mirror_Flip

  - stepType: displayImage
    startTime: 85
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 88
    eventName: fbi_front_sync_avatar_on

  - stepType: displayCameras
    startTime: 88
    duration: 90.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: Mirror - Flip

  - stepType: sendLSLEvent
    startTime: 178
    eventName: fbi_front_sync_avatar_off

  - stepType: wait
    startTime: 178
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 179
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 180
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 181
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  # --- Front Async / ASYNC stroking (delay 0.5 s) ---

  - stepType: wait
    startTime: 182
    duration: 1.0

  - stepType: displayImage
    startTime: 183
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 186
    eventName: fbi_front_async_cue_audio_start

  - stepType: playSound
    startTime: 186

  - stepType: sendLSLEvent
    startTime: 186
    eventName: fbi_front_async_avatar_on

  - stepType: displayCameras
    startTime: 186
    duration: 90.0
    cameraDatas:
    - id: '1'
      delay: 0.5
      configName: Mirror - Flip

  - stepType: sendLSLEvent
    startTime: 276
    eventName: fbi_front_async_avatar_off

  - stepType: wait
    startTime: 276
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 277
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 278
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 279
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  # --- Back Sync / SYNC stroking (delay 0 s) ---

  - stepType: wait
    startTime: 280
    duration: 1.0

  - stepType: sendLSLEvent
    startTime: 281
    eventName: config_loaded_3PP

  - stepType: loadConfig
    startTime: 281
    configName: 3PP

  - stepType: displayImage
    startTime: 282
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 285
    eventName: fbi_back_sync_cue_audio_start

  - stepType: playSound
    startTime: 285

  - stepType: sendLSLEvent
    startTime: 285
    eventName: fbi_back_sync_avatar_on

  - stepType: displayCameras
    startTime: 285
    duration: 90.0
    cameraDatas:
    - id: '2'
      delay: 0.0
      configName: 3PP

  - stepType: sendLSLEvent
    startTime: 375
    eventName: fbi_back_sync_avatar_off

  - stepType: wait
    startTime: 375
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 376
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 377
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 378
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  # --- Back Async / ASYNC stroking (delay 0.5 s) ---

  - stepType: wait
    startTime: 379
    duration: 1.0

  - stepType: displayImage
    startTime: 380
    imagePath: plus
    scale: 0.3
    duration: 3.0

  - stepType: sendLSLEvent
    startTime: 383
    eventName: fbi_back_async_cue_audio_start

  - stepType: playSound
    startTime: 383

  - stepType: sendLSLEvent
    startTime: 383
    eventName: fbi_back_async_avatar_on

  - stepType: displayCameras
    startTime: 383
    duration: 90.0
    cameraDatas:
    - id: '2'
      delay: 0.5
      configName: 3PP

  - stepType: sendLSLEvent
    startTime: 473
    eventName: fbi_back_async_avatar_off

  - stepType: wait
    startTime: 473
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 474
    blocking: true
    question: I felt that the body I saw was my body.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 475
    blocking: true
    question: I felt that the touch I felt was located where I saw the stroking.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 476
    blocking: true
    question: I felt as if I have three bodies.
    leftLabel: Strongly disagree
    rightLabel: Strongly agree
    min: 0
    max: 100
    randomCursorPosition: true

  - stepType: break
    startTime: 477
    text: Baseline measurement complete. Please take a short break.
    duration: 30

  # =========================================================================
  # 1. 1PP EMBODIMENT - camera 1, 1PP config
  # =========================================================================

  - stepType: loadScene
    startTime: 507
    scenePath: EmptyRoom

  - stepType: sendLSLEvent
    startTime: 508
    eventName: phase1_audio_NoM_Phase1_start

  - stepType: playSound
    startTime: 508
    soundPath: NoM_Phase1

  # settle: hold previous-phase config before interpolation

  - stepType: displayCameras
    startTime: 508
    duration: 4.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP

  - stepType: sendLSLEvent
    startTime: 513
    eventName: phase1_avatar_change_to_1PP_start

  - stepType: displayCameras
    startTime: 513
    duration: 75.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP

  - stepType: sendLSLEvent
    startTime: 518
    eventName: phase1_avatar_change_to_1PP_done

  - stepType: sendLSLEvent
    startTime: 585.208
    eventName: phase1_audio_NoM_Phase1_end

  - stepType: sendLSLEvent
    startTime: 588
    eventName: phase1_avatar_off

  - stepType: wait
    startTime: 588
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 589
    blocking: true
    question: How much do you feel that the body that you saw is your body?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 590
    blocking: true
    question: How much do you experience the sensations of your body right now?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 591
    blocking: true
    question: How much do you feel your center of awareness to be located where you feel your body to be?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 592
    blocking: true
    question: How many times have you been experiencing the nature of mind during this last phase of the experiment?
    leftLabel: Never
    rightLabel: Continuously
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 593
    blocking: true
    question: How stable is your attention right now?
    leftLabel: Not stable
    rightLabel: Very stable
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 594
    blocking: true
    question: How clearly do you feel your body?
    leftLabel: Not clearly
    rightLabel: Very clearly
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: wait
    startTime: 595
    duration: 1.0

  # =========================================================================
  # 2. 3PP BACK (OBX) - camera 2, 3PP back config
  # =========================================================================

  # settle: hold previous-phase config before interpolation

  - stepType: displayCameras
    startTime: 596
    duration: 4
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP

  - stepType: sendLSLEvent
    startTime: 601
    eventName: phase2_audio_NoM_Phase2_start

  - stepType: playSound
    startTime: 601
    soundPath: NoM_Phase2_v2

  - stepType: sendLSLEvent
    startTime: 601
    eventName: phase2_avatar_change_to_3PP_start

  - stepType: displayCameras
    startTime: 601
    duration: 119.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP
      fade:
        duration: 1.5
        delay: 10
    - id: '2'
      delay: 0.0
      configName: 3PP - Back
    rigInterpolation:
      startPosition:
        x: 0.0
        y: 0.0
        z: 0.0
      endPosition:
        x: 0.0
        y: 0.0
        z: -1.5
      startYaw: 0.0
      endYaw: 0.0
      delay: 0.0
      duration: 5.0
      ease: InOutSine

  - stepType: sendLSLEvent
    startTime: 606
    eventName: phase2_avatar_change_to_3PP_done

  - stepType: sendLSLEvent
    startTime: 679.456
    eventName: phase2_audio_NoM_Phase2_end

  - stepType: sendLSLEvent
    startTime: 720
    eventName: phase2_avatar_off

  - stepType: wait
    startTime: 720
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 721
    blocking: true
    question: How much do you feel that the body that you saw is your body?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 722
    blocking: true
    question: How much do you experience the sensations of your body right now?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 723
    blocking: true
    question: How much do you feel your center of awareness to be located where you feel your body to be?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 724
    blocking: true
    question: How many times have you been experiencing the nature of mind during this last phase of the experiment?
    leftLabel: Never
    rightLabel: Continuously
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayQuestion
    startTime: 725
    blocking: true
    question: Where do you feel yourself to be located?
    options:
    - Inside the body I see
    - Outside the body I see
    - Somewhere else / unclear

  - stepType: displayLikertScale
    startTime: 726
    blocking: true
    question: Does this body feel like yours?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: wait
    startTime: 727
    duration: 1.0

  # =========================================================================
  # 3. 1PP INVERTED - camera 1, inverted config
  # =========================================================================

  # settle: hold previous-phase config before interpolation

  - stepType: displayCameras
    startTime: 728
    duration: 4.0
    cameraDatas:
    - id: '2'
      delay: 0.0
      configName: 3PP - Back

  - stepType: sendLSLEvent
    startTime: 733
    eventName: phase3_audio_NoM_Phase3_start

  - stepType: playSound
    startTime: 733
    soundPath: NoM_Phase3_v2

  - stepType: sendLSLEvent
    startTime: 733
    eventName: phase3_avatar_change_to_1PP_Flip_start

  - stepType: displayCameras
    startTime: 733
    duration: 167.0
    cameraDatas:
    - id: '1'
      delay: 0.0
      configName: 1PP - Flip
    - id: '2'
      delay: 0.0
      configName: 3PP - Back
      fade:
        duration: 1.5
        delay: 5

    rigInterpolation:
      startPosition:
        x: 0.0
        y: 0.0
        z: -1.5
      endPosition:
        x: 0.0
        y: 0.0
        z: 0.0
      startYaw: 0.0
      endYaw: 0.0
      delay: 0.0
      duration: 5.0
      ease: InOutSine

  - stepType: sendLSLEvent
    startTime: 738
    eventName: phase3_avatar_change_to_1PP_Flip_done

  - stepType: sendLSLEvent
    startTime: 809.68
    eventName: phase3_audio_NoM_Phase3_end

  - stepType: sendLSLEvent
    startTime: 900
    eventName: phase3_avatar_off

  - stepType: wait
    startTime: 900
    duration: 1.0

  - stepType: displayLikertScale
    startTime: 901
    blocking: true
    question: How much do you feel that the body that you saw is your body?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 902
    blocking: true
    question: How much do you experience the sensations of your body right now?
    leftLabel: Not at all
    rightLabel: Completely
    min: 0
    max: 5
    randomCursorPosition: true

  - stepType: displayLikertScale
    startTime: 903
    blocking: true
